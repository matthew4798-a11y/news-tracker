name: Update digest

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes, around the clock
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python digest.py
      - name: Commit updated page
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs/index.html state.json
          git diff --cached --quiet || git commit -m "Update digest"
          git pull --rebase origin main
          git push
